name: Check Rotterdam Appointments

on:
  # Triggered on a schedule by cron-job.org via the workflow_dispatch API
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push to the NTFY_TOPIC secret
        type: boolean
        default: false

jobs:
  check-appointments:
    runs-on: ubuntu-latest
    # Backstop so a stuck run never overlaps the next 10-minute trigger
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --fail -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: Rotterdam checker test" \
            -H "Tags: white_check_mark,calendar" \
            -H "Click: ${RUN_URL}" \
            -d "Test push from GitHub Actions via the NTFY_TOPIC secret. Real alerts will arrive here."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      # Plain pip: no extra tool download from GitHub releases, which 504'd
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run appointment checker
        # Step timeout counts as a failure (a job timeout is a cancel), so the
        # ntfy "Notify on failure" step still fires if Chrome or the page hangs
        timeout-minutes: 6
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python check_appointments.py
      
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://ntfy.sh/${NTFY_TOPIC:-rotterdam-appointments-default}" \
            -H "Title: Rotterdam checker workflow failed" \
            -H "Priority: high" \
            -H "Tags: x,warning" \
            -H "Click: ${RUN_URL}" \
            -d "GitHub Actions run failed. Logs: ${RUN_URL}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            *.log
            *.png
          retention-days: 7

