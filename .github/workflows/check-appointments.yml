name: Check Rotterdam Appointments

on:
  # Triggered every 5 minutes by cron-job.org via the workflow_dispatch API
  workflow_dispatch:

jobs:
  check-appointments:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      
      - name: Install dependencies with uv
        run: |
          uv pip install --system -r requirements.txt
      
      - name: Run appointment checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python check_appointments.py
      
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST "https://ntfy.sh/${NTFY_TOPIC:-rotterdam-appointments-default}" \
            -H "Title: Rotterdam checker workflow failed" \
            -H "Priority: high" \
            -H "Tags: x,warning" \
            -H "Click: ${RUN_URL}" \
            -d "GitHub Actions run failed. Logs: ${RUN_URL}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            *.log
            *.png
          retention-days: 7

